<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stradivarius Style - Página de Ejemplo</title>
    <!-- Fuente moderna e industrial -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Encabezados estilo editorial de moda */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
            max-width: 600px;
            margin: 0 auto 40px auto;
            letter-spacing: 0.3px;
        }

        /* Contenedor del video centrado */
        .video-container {
            display: flex;
            justify-content: center;
            margin: 0 auto;
            max-width: 800px;
        }

        iframe {
            border: none;
            width: 100%;
            max-width: 720px;
            height: 405px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body>

    <!-- Encabezado principal -->
    <h1>ENCABEZADO PRINCIPAL</h1>
    <h2>CAMINO NUÑEZ CARDENAS</h2>
    
    <p>Este es un párrafo de ejemplo para el contenido de tu sitio web adaptado al diseño minimalista y editorial de Stradivarius.</p>

    <!-- Video de YouTube incrustado -->
    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/TTzrFxeBiUQ" 
            title="Reproductor de video de YouTube" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <p>Por fin me voy</p>

</body>
</html>
