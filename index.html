<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de la página</title>
    <style>
        body {
            background-color: pink;
            color: white;
            text-align: center; /* Centra los textos */
            font-family: sans-serif;
            padding: 20px;
        }

        /* Contenedor para centrar el video */
        .video-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        iframe {
            border: none;
            border-radius: 12px;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h1>Encabezado principal</h1>
    <h2>Camino Nuñez Cardenas</h2>
    <p>Este es un párrafo de ejemplo para el contenido de tu sitio web.</p>

    <!-- Video centrado -->
    <div class="video-container">
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/TTzrFxeBiUQ" 
            title="Reproductor de video de YouTube" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
